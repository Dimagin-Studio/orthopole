  <!-- Night shift : applique le thème avant le rendu pour éviter un flash. -->
  <script>
    (function () {
      try {
        var DARK_START = 20, DARK_END = 7;
        var h = new Date().getHours();
        var auto = (h >= DARK_START || h < DARK_END) ? "dark" : "light";
        var theme = auto;
        var raw = localStorage.getItem("theme-override");
        if (raw) {
          var o = JSON.parse(raw);
          if (o && o.auto === auto && (o.value === "dark" || o.value === "light")) {
            theme = o.value;
          } else {
            localStorage.removeItem("theme-override");
          }
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
